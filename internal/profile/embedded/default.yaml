apiVersion: agentctl.dev/v1
kind: Profile
metadata:
  name: default
  description: >-
    Baseline built-in profile: default-deny egress, LAN blocked, modest
    resources. Intended as a starting point to copy and adjust, not as a
    one-size-fits-all production policy.
spec:
  network:
    denyLAN: true
    allow:
      # The Claude API by name: on Incus a wildcard only resolves its
      # apex (anthropic.com), so "*.anthropic.com" alone wouldn't cover it.
      - domain: "api.anthropic.com"
        ports: [443]
      - domain: "*.anthropic.com"
        ports: [443]
      - domain: "pypi.org"
        ports: [443]
      - domain: "files.pythonhosted.org"
        ports: [443]
    ports: []
  resources:
    cpuCores: 2
    memory: "4GiB"
    diskSize: "20GiB"
  mounts:
    - hostPath: "~/agentctl/workspaces/{{.Name}}"
      guestPath: "/workspace"
      readOnly: false
  console:
    viewer: "spice"
